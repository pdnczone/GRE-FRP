name: build-panel

on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".github/workflows/build-panel.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build gre-panel (amd64 + arm64)
        run: |
          cd panel
          VER="panel-r${{ github.run_number }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.panelVersion=$VER" -o gre-panel-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.panelVersion=$VER" -o gre-panel-linux-arm64 .
          ./gre-panel-linux-amd64 --version
          ls -la gre-panel-linux-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-r${{ github.run_number }}
          name: "Panel build r${{ github.run_number }}"
          body: "Auto-built gre-panel from ${{ github.sha }}"
          files: |
            panel/gre-panel-linux-amd64
            panel/gre-panel-linux-arm64
            panel/grepanel
